<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025 NHL Playoff Pool — Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rink: #0a1628; --rink-mid: #112240; --rink-surface: #162d4a;
    --gold: #f0a500; --gold-light: #ffc94d;
    --red: #c8102e; --white: #ffffff; --muted: #7a9bb5;
    --success: #2ecc71; --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: var(--rink); color: var(--white); min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(240,165,0,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(200,16,46,0.08) 0%, transparent 60%); }

  header { text-align: center; padding: 2rem 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.08); position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--red), var(--gold), var(--red)); }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
  h1 span { color: var(--gold); }
  .subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem; letter-spacing: 0.05em; text-transform: uppercase; }

  .container { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .tabs { display: flex; gap: 4px; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .tab-btn { font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.6rem 1.2rem; background: transparent; border: none; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s; }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-btn:hover:not(.active) { color: var(--white); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Scoreboard */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
  .refresh-btn { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.45rem 1rem; background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius); color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }
  .last-updated { font-size: 0.78rem; color: var(--muted); }

  .leaderboard { display: flex; flex-direction: column; gap: 8px; }
  .player-card { background: var(--rink-mid); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color 0.15s; }
  .player-card:hover { border-color: rgba(240,165,0,0.35); }
  .player-card.expanded { border-color: rgba(240,165,0,0.5); }
  .player-card.rank-1 { border-color: rgba(240,165,0,0.6); }
  .player-card.rank-2 { border-color: rgba(180,180,180,0.4); }
  .player-card.rank-3 { border-color: rgba(185,115,50,0.4); }

  .player-header { display: flex; align-items: center; gap: 12px; padding: 1rem 1.1rem; }
  .rank-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; font-weight: 800; width: 36px; text-align: center; flex-shrink: 0; color: var(--muted); }
  .rank-badge.r1 { color: var(--gold); }
  .rank-badge.r2 { color: #b0b0b0; }
  .rank-badge.r3 { color: #cd7f4b; }
  .player-name { font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.03em; flex: 1; }
  .correct-badge { font-size: 0.72rem; background: rgba(46,204,113,0.15); color: var(--success); border: 1px solid rgba(46,204,113,0.25); border-radius: 99px; padding: 2px 8px; margin-left: 8px; white-space: nowrap; }
  .score-block { text-align: right; }
  .score-pts { font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--gold); line-height: 1; }
  .score-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .expand-icon { color: var(--muted); font-size: 0.9rem; flex-shrink: 0; transition: transform 0.2s; }
  .player-card.expanded .expand-icon { transform: rotate(180deg); }

  .picks-breakdown { display: none; border-top: 1px solid rgba(255,255,255,0.07); padding: 0.75rem 1.1rem 1rem; }
  .player-card.expanded .picks-breakdown { display: block; }

  .round-group { margin-bottom: 1rem; }
  .round-group-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin-bottom: 0.4rem; }
  .breakdown-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 5px; }

  .pick-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: var(--radius); font-size: 0.82rem; }
  .pick-row.correct { background: rgba(46,204,113,0.12); }
  .pick-row.wrong   { background: rgba(200,16,46,0.10); }
  .pick-row.pending { background: rgba(122,155,181,0.10); }
  .pick-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .correct .pick-dot { background: var(--success); }
  .wrong   .pick-dot { background: #c8102e; }
  .pending .pick-dot { background: var(--muted); }
  .pick-series { color: var(--muted); font-size: 0.7rem; white-space: nowrap; }
  .pick-team { flex: 1; font-weight: 500; color: var(--white); }
  .pick-pts { font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; font-weight: 700; }
  .correct .pick-pts { color: var(--success); }
  .wrong   .pick-pts { color: rgba(200,16,46,0.7); text-decoration: line-through; }
  .pending .pick-pts { color: var(--muted); }
  .no-pick { font-size: 0.78rem; color: var(--muted); font-style: italic; }

  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
  .empty-state strong { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--white); margin-bottom: 0.4rem; }

  /* Admin */
  .admin-login { max-width: 360px; margin: 0 auto; background: var(--rink-mid); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1.5rem; }
  .field-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 0.5rem; }
  input[type=password] { width: 100%; padding: 0.6rem 1rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius); color: var(--white); font-family: 'Barlow', sans-serif; font-size: 1rem; outline: none; margin-bottom: 0.8rem; }
  input[type=password]:focus { border-color: var(--gold); }

  .admin-panel { display: none; }
  .round-section { margin-bottom: 2rem; }
  .round-heading { font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 2px solid var(--gold); padding-bottom: 0.3rem; margin-bottom: 0.8rem; }
  .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .result-card { background: var(--rink-mid); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 0.8rem 1rem; }
  .result-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .result-teams { display: flex; gap: 6px; }
  .result-btn { flex: 1; padding: 0.5rem 0.4rem; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.12); border-radius: var(--radius); color: var(--white); font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; cursor: pointer; text-align: center; transition: all 0.15s; line-height: 1.2; }
  .result-btn:hover { background: rgba(255,255,255,0.1); }
  .result-btn.selected { background: rgba(46,204,113,0.2); border-color: var(--success); color: #2ecc71; }

  .save-btn { width: 100%; padding: 0.85rem; background: var(--gold); color: var(--rink); font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; border: none; border-radius: var(--radius); cursor: pointer; margin-top: 1rem; transition: all 0.15s; }
  .save-btn:hover { background: var(--gold-light); }
  .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status-msg { margin-top: 0.8rem; padding: 0.7rem 1rem; border-radius: var(--radius); font-size: 0.88rem; display: none; }
  .status-msg.success { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.3); color: var(--success); display: block; }
  .status-msg.error   { background: rgba(200,16,46,0.15);  border: 1px solid rgba(200,16,46,0.3);  color: #ff6b7a; display: block; }

  @media (max-width: 500px) { .breakdown-grid, .results-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div style="font-size:1.8rem;margin-bottom:0.4rem">🏆</div>
  <h1>2025 NHL <span>Playoff</span> Pool</h1>
  <p class="subtitle">Live Scoreboard</p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('scoreboard')">Scoreboard</button>
    <button class="tab-btn" onclick="switchTab('admin')">Admin</button>
  </div>

  <!-- SCOREBOARD -->
  <div class="tab-panel active" id="tab-scoreboard">
    <div class="toolbar">
      <button class="refresh-btn" onclick="loadScoreboard()">↻ Refresh scores</button>
      <span class="last-updated" id="last-updated"></span>
    </div>
    <div class="leaderboard" id="leaderboard">
      <div class="empty-state"><strong>Loading...</strong></div>
    </div>
  </div>

  <!-- ADMIN -->
  <div class="tab-panel" id="tab-admin">
    <div class="admin-login" id="admin-login-box">
      <label class="field-label">Admin password</label>
      <input type="password" id="admin-pw" placeholder="Enter password..." />
      <button class="save-btn" onclick="adminLogin()">Unlock admin panel</button>
      <div class="status-msg" id="login-status"></div>
    </div>
    <div class="admin-panel" id="admin-panel">
      <div id="results-rounds"></div>
      <button class="save-btn" onclick="saveResults()">Save results to sheet</button>
      <div class="status-msg" id="save-status"></div>
    </div>
  </div>
</div>

<script>
// ── PASTE YOUR SCRIPT URL HERE ───────────────────────────────────────────────
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzomlRugJ2QZlAUgOKu0DHJdgk-OVzu7KTRas78w4AHVIUQB-RALLkY0RfxUkKbPLua/exec";

// ── KEEP IN SYNC WITH nhl-pool.html ─────────────────────────────────────────
const ROUNDS = {
  r1: {
    name: "First Round",
    series: [
      { id: "r1s1", label: "Eastern — Series 1",  teamA: "Sabres", teamB: "Bruins" },
      { id: "r1s2", label: "Eastern — Series 2",  teamA: "Lightning", teamB: "Canadiens" },
      { id: "r1s3", label: "Eastern — Series 3",  teamA: "Canes", teamB: "Sens" },
      { id: "r1s4", label: "Eastern — Series 4",  teamA: "Pens", teamB: "Flyers" },
      { id: "r1s5", label: "Western — Series 5",  teamA: "Avs", teamB: "Kings" },
      { id: "r1s6", label: "Western — Series 6",  teamA: "Stars", teamB: "Wild" },
      { id: "r1s7", label: "Western — Series 7",  teamA: "Knights", teamB: "Mammoth" },
      { id: "r1s8", label: "Western — Series 8",  teamA: "Oilers", teamB: "Ducks" },
    ]
  },
  r2: {
    name: "Second Round",
    series: [
      { id: "r2s1", label: "Eastern — Series 9",   teamA: "East R1 Winner 1", teamB: "East R1 Winner 2" },
      { id: "r2s2", label: "Eastern — Series 10",  teamA: "East R1 Winner 3", teamB: "East R1 Winner 4" },
      { id: "r2s3", label: "Western — Series 11",  teamA: "West R1 Winner 1", teamB: "West R1 Winner 2" },
      { id: "r2s4", label: "Western — Series 12",  teamA: "West R1 Winner 3", teamB: "West R1 Winner 4" },
    ]
  },
  r3: {
    name: "Conference Finals",
    series: [
      { id: "r3s1", label: "Eastern Final — Series 13", teamA: "East R2 Winner 1", teamB: "East R2 Winner 2" },
      { id: "r3s2", label: "Western Final — Series 14", teamA: "West R2 Winner 1", teamB: "West R2 Winner 2" },
    ]
  },
  r4: {
    name: "Stanley Cup Final",
    series: [
      { id: "r4s1", label: "Stanley Cup Final — Series 15", teamA: "Eastern Champion", teamB: "Western Champion" },
    ]
  }
};

const SERIES_MAP = {};
Object.values(ROUNDS).forEach(r => r.series.forEach(s => { SERIES_MAP[s.id] = s; }));

// ── TABS ─────────────────────────────────────────────────────────────────────

function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((b, i) =>
    b.classList.toggle("active", (i === 0) === (tab === "scoreboard")));
  document.getElementById("tab-scoreboard").classList.toggle("active", tab === "scoreboard");
  document.getElementById("tab-admin").classList.toggle("active", tab === "admin");
}

// ── SCOREBOARD ────────────────────────────────────────────────────────────────

async function loadScoreboard() {
  document.getElementById("leaderboard").innerHTML = '<div class="empty-state"><strong>Loading...</strong></div>';
  if (SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
    document.getElementById("leaderboard").innerHTML = '<div class="empty-state"><strong>Setup needed</strong>Paste your Script URL into SCRIPT_URL.</div>';
    return;
  }
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getScoreboard`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    renderScoreboard(json.scoreboard, json.results);
    document.getElementById("last-updated").textContent = "Last refreshed: " + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById("leaderboard").innerHTML = `<div class="empty-state"><strong>Could not load scores</strong>${err.message}</div>`;
  }
}

function renderScoreboard(scoreboard, results) {
  const lb = document.getElementById("leaderboard");
  if (!scoreboard || scoreboard.length === 0) {
    lb.innerHTML = '<div class="empty-state"><strong>No picks yet</strong>Share the pool link to get started.</div>';
    return;
  }

  lb.innerHTML = scoreboard.map((player, idx) => {
    const rank = idx + 1;
    const rankClass = rank <= 3 ? `r${rank}` : "";
    const decided = player.seriesScores.filter(s => s.decided);
    const correct = player.seriesScores.filter(s => s.correct).length;

    // Group picks by round
    const roundGroups = Object.entries(ROUNDS).map(([roundId, round]) => {
      const roundSeries = round.series.map(s => {
        const score = player.seriesScores.find(sc => sc.seriesId === s.id);
        return { meta: s, score };
      });
      return { roundId, roundName: round.name, roundSeries };
    });

    const breakdown = roundGroups.map(g => {
      const rows = g.roundSeries.map(({ meta, score }) => {
        if (!score || !score.picked) {
          return `<div class="pick-row pending"><div class="pick-dot"></div><span class="pick-series">${meta.label.split("—")[0].trim()}</span><span class="no-pick">No pick yet</span></div>`;
        }
        const stateClass = !score.decided ? "pending" : score.correct ? "correct" : "wrong";
        const ptsDisplay = !score.decided ? `${score.points}?` : score.correct ? `+${score.points}` : "0";
        return `<div class="pick-row ${stateClass}">
          <div class="pick-dot"></div>
          <span class="pick-series">${meta.label.split("—")[0].trim()}</span>
          <span class="pick-team">${escHtml(score.picked)}</span>
          <span class="pick-pts">${ptsDisplay}</span>
        </div>`;
      }).join("");
      return `<div class="round-group"><div class="round-group-label">${g.roundName}</div><div class="breakdown-grid">${rows}</div></div>`;
    }).join("");

    return `
      <div class="player-card rank-${rank <= 3 ? rank : ""}" id="card-${idx}" onclick="toggleCard(${idx})">
        <div class="player-header">
          <div class="rank-badge ${rankClass}">${rank}</div>
          <div class="player-name">${escHtml(player.name)}${decided.length > 0 ? `<span class="correct-badge">${correct}/${decided.length} correct</span>` : ""}</div>
          <div class="score-block">
            <div class="score-pts">${player.totalEarned}</div>
            <div class="score-label">pts earned</div>
          </div>
          <div class="expand-icon">▾</div>
        </div>
        <div class="picks-breakdown">${breakdown}</div>
      </div>`;
  }).join("");
}

function toggleCard(idx) {
  document.getElementById(`card-${idx}`).classList.toggle("expanded");
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────

let adminPassword = "";
let resultSelections = {};

function adminLogin() {
  const pw = document.getElementById("admin-pw").value.trim();
  if (!pw) return;
  adminPassword = pw;
  document.getElementById("admin-login-box").style.display = "none";
  document.getElementById("admin-panel").style.display = "block";
  renderResultsForm();
}

function renderResultsForm() {
  document.getElementById("results-rounds").innerHTML = Object.entries(ROUNDS).map(([, round]) => `
    <div class="round-section">
      <div class="round-heading">${round.name}</div>
      <div class="results-grid">
        ${round.series.map(s => `
          <div class="result-card">
            <div class="result-label">${s.label}</div>
            <div class="result-teams">
              <button class="result-btn" id="rb-${s.id}-a" onclick="selectResult('${s.id}','${escQ(s.teamA)}','${escQ(s.teamB)}')">${s.teamA}</button>
              <button class="result-btn" id="rb-${s.id}-b" onclick="selectResult('${s.id}','${escQ(s.teamB)}','${escQ(s.teamA)}')">${s.teamB}</button>
            </div>
          </div>`).join("")}
      </div>
    </div>`).join("");
}

function selectResult(seriesId, winner, other) {
  resultSelections[seriesId] = winner;
  const series = SERIES_MAP[seriesId];
  document.getElementById(`rb-${seriesId}-a`).classList.toggle("selected", winner === series.teamA);
  document.getElementById(`rb-${seriesId}-b`).classList.toggle("selected", winner === series.teamB);
}

async function saveResults() {
  if (SCRIPT_URL === "YOUR GOOGLE SHEET") {
    showSaveStatus("error", "Paste your Script URL into SCRIPT_URL first.");
    return;
  }
  const results = Object.entries(resultSelections).map(([seriesId, winner]) => ({ seriesId, winner }));
  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveResults", password: adminPassword, results })
    });
    const json = await res.json();
    json.success
      ? showSaveStatus("success", "Results saved! Switch to Scoreboard and hit Refresh.")
      : showSaveStatus("error", json.error || "Unknown error.");
  } catch (err) {
    showSaveStatus("error", "Network error: " + err.message);
  }
}

function showSaveStatus(type, msg) {
  const el = document.getElementById("save-status");
  el.className = "status-msg " + type;
  el.textContent = msg;
}

function escHtml(str) { return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escQ(str)    { return String(str).replace(/'/g,"\\'"); }

loadScoreboard();
</script>
</body>
</html>
